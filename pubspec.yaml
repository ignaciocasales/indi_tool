name: indi_tool
description: "INDI Diagnostics Tool."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: ^3.9.2 # Dart SDK
  flutter: '>3.0.0' # Flutter SDK

dependencies:
  # The flutter SDK
  flutter:
    sdk: flutter

  # Riverpod state management
  flutter_riverpod: ^3.0.0
  # SQFlite riverpod plugin
  riverpod_sqflite: ^0.3.0

  # SQLite plugin for Flutter (mobile)
  sqflite: ^2.4.2
  # SQLite FFI for desktop (Windows/Linux/macOS)
  sqflite_common_ffi: ^2.3.3

  # For working with paths
  path: ^1.9.1

  # For generating UUIDs
  uuid: ^4.5.1

  # HTTP client
  dio: ^5.7.0

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Default Lints
  flutter_lints: ^6.0.0

  # Custom Linting
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true

analyzer:
  plugins:
    - custom_lint