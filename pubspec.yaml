name: indi_tool
description: "INDI Diagnostics Tool."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: ^3.9.2 # Dart SDK
  flutter: '>3.0.0' # Flutter SDK

dependencies:
  # The flutter SDK
  flutter:
    sdk: flutter

  # Riverpod state management
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Default Lints
  flutter_lints: ^6.0.0

  # Custom Linting
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true

analyzer:
  plugins:
    - custom_lint