name: indi_tool
description: "INDI Diagnostics Tool."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+1

environment:
  sdk: ^3.9.2 # Dart SDK
  flutter: '>3.0.0' # Flutter SDK

dependencies:
  # The flutter SDK
  flutter:
    sdk: flutter

  # Utility functions and classes that operate on lists.
  collection: any

  # HTTP networking package
  dio: ^5.9.0

  # Reactive library to store relational data
  drift: ^2.29.2
  drift_flutter: ^0.2.7

  # Plugin that manages files and interactions with file dialogs
  file_selector: ^1.0.4

  # Customizable Flutter chart library
  fl_chart: ^1.1.1

  # Riverpod state management
  flutter_riverpod: ^3.0.3

  # Provides internationalization and localization facilities
  intl: ^0.20.2

  # Cross-platform path manipulation library
  path: ^1.9.1

  # Plugin for finding commonly used locations on the filesystem
  path_provider: ^2.1.5

  # SQLite plugin for Flutter (mobile)
  sqflite: ^2.4.2
  # SQLite FFI for desktop (Windows/Linux/macOS)
  sqflite_common_ffi: ^2.3.6

  # For generating UUIDs
  uuid: ^4.5.1

  # Plugin for comprehensive window management capabilities
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Default Lints
  flutter_lints: ^6.0.0

  # Custom Linting
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.7.1

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/google_fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/google_fonts/RobotoMono-VariableFont_wght.ttf
        - asset: assets/google_fonts/RobotoMono-Italic-VariableFont_wght.ttf

analyzer:
  plugins:
    - custom_lint